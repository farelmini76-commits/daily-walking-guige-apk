name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d. -f1)
          if [ -z "$JAVA_VERSION" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or newer. Found: $JAVA_VERSION"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Ensure environment file exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected debug APK not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          echo "Found APK: $APK_PATH ($APK_SIZE bytes)"
          if [ "$APK_SIZE" -le 1048576 ]; then
            echo "ERROR: Debug APK file size is too small ($APK_SIZE bytes). Expected > 1MB."
            exit 1
          fi
          echo "Debug APK verified successfully ($APK_SIZE bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish debug APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug APK"
          body: |
            Automated debug APK build.
            Direct download: [app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
